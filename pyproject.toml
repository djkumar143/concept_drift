[project]
name = "concept_drift"
version = "0.1.0"
description = "This project demonstrates real time feature and concept drift using Kafka and PySpark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.31.0",
    "kafka-python-ng>=2.2.3",
    "pandas>=2.3.3",
    "psycopg2>=2.9.12",
    "pyspark==3.5.6",
    "pytz>=2026.3.post1",
    "river>=0.25.0",
    "scipy>=1.18.0",
    "setuptools>=83.0.0",
]
